<!doctype html>
<html lang="es" data-theme="dark" style="color-scheme: dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>C-14 Encabezado rev 2</title>
  <link rel="icon" href="../../../../design-system/assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../../../design-system/tokens.css" />
  <script src="../../../../design-system/brand.js"></script>
  <style>
    @font-face { font-family: "Outfit"; font-weight: 400; font-display: swap; src: url("../../../../node_modules/@fontsource/outfit/files/outfit-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Outfit"; font-weight: 600; font-display: swap; src: url("../../../../node_modules/@fontsource/outfit/files/outfit-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Outfit"; font-weight: 700; font-display: swap; src: url("../../../../node_modules/@fontsource/outfit/files/outfit-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: swap; src: url("../../../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }

    /* Rev 2 del encabezado de la estación (C-14). Solo tokens Rev 4. */
    :root { --raised: color-mix(in srgb, var(--text-primary) 6%, var(--bg-surface)); }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: none; box-shadow: var(--shadow-focus); }
    [hidden] { display: none !important; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-glass); font-weight: 700; }
    .topbar img { width: 30px; height: 30px; border-radius: 8px; }
    .page { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }
    @media (min-width: 1024px) { .page { padding: 28px 32px; } }
    .back { display: inline-flex; gap: 6px; align-items: center; color: var(--accent-gold); font-size: var(--text-sm); font-weight: 600; margin-bottom: 10px; }

    .head { display: grid; gap: 12px; margin-bottom: 20px; }
    @media (min-width: 1024px) { .head { grid-template-columns: minmax(0, 1fr) auto; align-items: center; } }
    .title-row { display: flex; align-items: flex-start; gap: 14px; min-width: 0; }
    .vessel { width: 44px; height: 44px; border-radius: 12px; background: var(--bg-dark-card); border: 1px solid color-mix(in srgb, var(--accent-gold) 35%, transparent); display: grid; place-items: center; color: var(--accent-gold); flex-shrink: 0; }
    .subtitle { margin: 4px 0 0; color: var(--text-secondary); font-size: var(--text-sm); }

    /* Nombre de cafetera = botón (sin desplegable al lado) */
    .method-title { margin: 0; font-size: var(--text-2xl); letter-spacing: var(--tracking-tight); line-height: 1.15; }
    @media (min-width: 1024px) { .method-title { font-size: var(--text-3xl); } }
    .method-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 0 0; margin: 0; border: 0; background: none; cursor: pointer; border-radius: 10px; text-align: left; font: inherit; font-weight: 700; }
    .method-btn .chev { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--accent-gold); background: var(--accent-primary-soft); flex-shrink: 0; transition: transform var(--duration-fast) var(--ease-out); }
    .method-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
    @media (hover: hover) and (pointer: fine) { .method-btn:hover { color: var(--accent-gold); } }

    /* Variante A: menú desplegable */
    .menu-wrap { position: relative; }
    .menu { font-size: var(--text-base); font-weight: 400; letter-spacing: normal; line-height: 1.3; position: absolute; z-index: 10; top: calc(100% + 8px); left: 0; width: min(320px, calc(100vw - 32px)); padding: 6px; margin: 0; list-style: none; background: var(--bg-tooltip); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); transform-origin: top left; animation: pop var(--duration-fast) var(--ease-out); }
    @keyframes pop { from { transform: scale(0.96); } to { transform: none; } }
    .menu li button { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 6px 10px; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer; }
    .menu li button:hover, .menu li button:focus-visible { background: var(--raised); box-shadow: none; }
    .menu .ico { width: 32px; height: 32px; border-radius: 9px; background: var(--bg-dark-card); display: grid; place-items: center; color: var(--accent-gold); }
    .menu .name { font-weight: 600; }
    .menu .meta { display: block; font-size: var(--text-xs); color: var(--text-muted); }
    .menu [aria-current="true"] { background: color-mix(in srgb, var(--accent-gold) 9%, transparent); }
    .menu .check { margin-left: auto; color: var(--accent-gold); }

    /* Variante B: hoja con grilla de cafeteras */
    .scrim { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--bg-canvas) 82%, transparent); }
    .sheet { position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; padding: 8px 16px 18px; background: var(--bg-surface); border: 1px solid var(--border-strong); border-bottom: 0; border-radius: 22px 22px 0 0; box-shadow: var(--shadow-card); }
    @media (min-width: 768px) { .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 560px; transform: translate(-50%, -50%); border-radius: var(--radius-xl); border-bottom: 1px solid var(--border-strong); padding: 18px; } }
    .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 0 auto 12px; }
    @media (min-width: 768px) { .grab { display: none; } }
    .sheet h2 { margin: 0 0 12px; font-size: var(--text-lg); }
    .grid6 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (min-width: 768px) { .grid6 { grid-template-columns: repeat(3, 1fr); } }
    .grid6 button { min-height: 88px; display: grid; justify-items: start; align-content: space-between; gap: 8px; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--raised); cursor: pointer; text-align: left; }
    .grid6 button[aria-current="true"] { border-color: color-mix(in srgb, var(--accent-gold) 70%, transparent); background: color-mix(in srgb, var(--accent-gold) 8%, var(--bg-surface)); }
    .grid6 .ico { color: var(--accent-gold); }
    .grid6 .name { font-weight: 700; }

    /* Disparador de receta compacto */
    .recipe-pill { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; min-height: 44px; padding: 6px 12px 6px 6px; border-radius: var(--radius-pill); border: 1px solid var(--border-strong); background: var(--raised); cursor: pointer; text-align: left; }
    @media (hover: hover) and (pointer: fine) { .recipe-pill:not(:disabled):hover { border-color: color-mix(in srgb, var(--accent-gold) 55%, transparent); } }
    .recipe-pill:not(:disabled):active { transform: scale(var(--scale-press)); }
    .recipe-pill:disabled { opacity: 0.55; cursor: not-allowed; }
    .recipe-pill .ico { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-primary-soft); color: var(--accent-gold); display: grid; place-items: center; flex-shrink: 0; }
    .recipe-pill .txt { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .recipe-pill .name { font-weight: 700; font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recipe-pill .meta { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-secondary); white-space: nowrap; }
    .recipe-pill .chev { color: var(--accent-gold); flex-shrink: 0; }
    @media (max-width: 420px) { .recipe-pill .meta { display: none; } }

    /* Variante B: fila "Receta:" de texto */
    .recipe-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 10px; font-size: var(--text-sm); color: var(--text-secondary); }
    .recipe-link { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 10px; border-radius: var(--radius-pill); border: 1px solid var(--border-subtle); background: transparent; color: var(--text-primary); font-weight: 700; cursor: pointer; }
    .recipe-link:hover { border-color: var(--border-strong); }
    .recipe-link .chev { color: var(--accent-gold); }

    .lock { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--status-warning); margin-top: 6px; }

    /* cuerpo esquemático */
    .body-ph { display: grid; gap: 18px; }
    @media (min-width: 1024px) { .body-ph { grid-template-columns: 1.08fr 0.92fr; } }
    .ph { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); min-height: 220px; padding: 18px; color: var(--text-muted); font-size: var(--text-sm); }

    .demo { position: fixed; left: 12px; bottom: 12px; z-index: 50; background: var(--bg-tooltip); border: 1px solid var(--border-strong); border-radius: 12px; padding: 8px 10px; font-size: 12px; color: var(--text-secondary); display: flex; gap: 8px; flex-wrap: wrap; }
    .demo select { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-subtle); border-radius: 8px; }
    [data-chrome="0"] .demo { display: none; }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="chev" viewBox="0 0 24 24"><polyline fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="6 9 12 15 18 9"/></symbol>
  <symbol id="book" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6.5A2.5 2.5 0 0 0 4 21.5M8 7h7M8 11h5"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><polyline fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="20 6 9 17 4 12"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g></symbol>
  <symbol id="v-cone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 10h-4z"/><path d="M8 19h8M12 15v4"/></g></symbol>
  <symbol id="v-hour" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l-4 8 4 10H7l4-10z"/></g></symbol>
  <symbol id="v-wedge" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-5 11H9z"/><path d="M8 20h8"/></g></symbol>
  <symbol id="v-cyl" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="15" rx="1"/><path d="M5 21h14"/></g></symbol>
  <symbol id="v-beaker" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="11" height="15" rx="1.5"/><path d="M11.5 2v10M9 6h5M17 9h2v7h-2"/></g></symbol>
  <symbol id="v-porta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM16 8h5M8 18h4"/></g></symbol>
</svg>

<header class="topbar"><img src="../../../../design-system/assets/logo.svg" alt="" /><span data-brand-name="short">Marca (TBD)</span></header>

<main class="page">
  <a class="back" href="#">Volver al catálogo</a>
  <div class="head" id="head"></div>
  <div class="body-ph"><div class="ph">Controles de dosis e intensidad y paso a paso (sin cambios)</div><div class="ph">Temporizador (sin cambios)</div></div>
</main>
<div id="overlay"></div>

<div class="demo" id="demo">
  <label>Variante <select id="d-var"><option value="a">A · Menú + píldora</option><option value="b">B · Hoja + fila de texto</option></select></label>
  <label>Cafetera <select id="d-method"></select></label>
  <label>Estado <select id="d-state"><option value="idle">Reposo</option><option value="open">Selector de cafetera abierto</option><option value="locked">En curso (bloqueado)</option></select></label>
</div>

<script>
(() => {
  const METHODS = [
    { id: 'v60', name: 'Hario V60', icon: 'v-cone', meta: 'Cono · 15 g', recipe: 'Método 4:6 (WBrC 2016)', author: 'Tetsu Kasuya', ratio: '1:15', temp: 92 },
    { id: 'chemex', name: 'Chemex', icon: 'v-hour', meta: 'Reloj de arena · 30 g', recipe: 'Chemex Estándar', author: 'Guía Estándar', ratio: '1:16', temp: 94 },
    { id: 'melitta', name: 'Melitta', icon: 'v-wedge', meta: 'Cuña · 20 g', recipe: 'Melitta Estándar', author: 'Guía Estándar', ratio: '1:16', temp: 93 },
    { id: 'aeropress', name: 'AeroPress', icon: 'v-cyl', meta: 'Inmersión y presión · 15 g', recipe: 'Ultimate AeroPress', author: 'James Hoffmann', ratio: '1:16,7', temp: 99 },
    { id: 'french-press', name: 'Prensa Francesa', icon: 'v-beaker', meta: 'Inmersión · 30 g', recipe: 'French Press Hoffmann', author: 'James Hoffmann', ratio: '1:16,7', temp: 96 },
    { id: 'espresso', name: 'Espresso', icon: 'v-porta', meta: 'Presión · 18 g', recipe: 'Espresso Estándar', author: 'Guía Estándar', ratio: '1:2', temp: 93 },
  ];
  const q = new URLSearchParams(location.search);
  let variant = q.get('variant') || 'a';
  let method = METHODS.find(m => m.id === q.get('method')) || METHODS[0];
  let state = q.get('state') || 'idle';
  if (q.get('chrome') === '0') document.documentElement.dataset.chrome = '0';
  const $ = s => document.querySelector(s);

  const methodBtn = () => `<h1 class="method-title"><span class="menu-wrap"><button class="method-btn" type="button" aria-haspopup="${variant === 'a' ? 'menu' : 'dialog'}" aria-expanded="${state === 'open'}" data-act="toggle" aria-label="${method.name}. Cambiar cafetera">${method.name}<span class="chev" aria-hidden="true"><svg width="16" height="16"><use href="#chev"/></svg></span></button>
      ${variant === 'a' && state === 'open' ? `<ul class="menu" role="menu" aria-label="Cambiar cafetera">${METHODS.map(m => `<li role="none"><button role="menuitemradio" aria-checked="${m.id === method.id}" aria-current="${m.id === method.id}" data-m="${m.id}"><span class="ico"><svg width="18" height="18"><use href="#${m.icon}"/></svg></span><span><span class="name">${m.name}</span><span class="meta">${m.meta}</span></span>${m.id === method.id ? '<svg class="check" width="16" height="16"><use href="#check"/></svg>' : ''}</button></li>`).join('')}</ul>` : ''}
    </span></h1>`;

  const lockNote = state === 'locked' ? '<div class="lock"><svg width="14" height="14"><use href="#lock"/></svg>Receta bloqueada durante la preparación</div>' : '';

  function render() {
    const locked = state === 'locked';
    const titleBlock = `<div class="title-row"><div class="vessel"><svg width="24" height="24"><use href="#${method.icon}"/></svg></div><div style="min-width:0">${methodBtn()}<p class="subtitle">Ajustá intensidad o dosis; cada pulso se recalcula con exactitud de balanza.</p>
      ${variant === 'b' ? `<div class="recipe-line">Receta <button class="recipe-link" type="button" ${locked ? 'disabled style="opacity:.55"' : ''}>${method.recipe}<svg class="chev" width="14" height="14"><use href="#chev"/></svg></button><span class="mono" style="font-size:var(--text-xs)">${method.author} · ${method.ratio} · ${method.temp} °C</span></div>${lockNote}` : ''}</div></div>`;
    const pill = variant === 'a' ? `<div><button class="recipe-pill" type="button" ${locked ? 'disabled' : ''}><span class="ico"><svg width="16" height="16"><use href="#book"/></svg></span><span class="txt"><span class="name">${method.recipe}</span><span class="meta">${method.ratio} · ${method.temp} °C</span></span><svg class="chev" width="16" height="16"><use href="#${locked ? 'lock' : 'chev'}"/></svg></button>${lockNote}</div>` : '';
    $('#head').innerHTML = titleBlock + pill;
    $('#overlay').innerHTML = variant === 'b' && state === 'open' ? `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Cambiar cafetera"><div class="grab"></div><h2>Cambiar cafetera</h2><div class="grid6">${METHODS.map(m => `<button data-m="${m.id}" aria-current="${m.id === method.id}"><svg class="ico" width="24" height="24"><use href="#${m.icon}"/></svg><span><span class="name">${m.name}</span><br/><span class="mono" style="font-size:var(--text-xs);color:var(--text-muted)">${m.meta}</span></span></button>`).join('')}</div></div>` : '';
    $('#d-var').value = variant; $('#d-method').value = method.id; $('#d-state').value = state;
  }
  $('#d-method').innerHTML = METHODS.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
  $('#d-var').onchange = e => { variant = e.target.value; render(); };
  $('#d-method').onchange = e => { method = METHODS.find(m => m.id === e.target.value); render(); };
  $('#d-state').onchange = e => { state = e.target.value; render(); };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act],[data-m]'); if (!b) return;
    if (b.dataset.m) { method = METHODS.find(m => m.id === b.dataset.m); state = 'idle'; }
    else if (b.dataset.act === 'toggle' && state !== 'locked') state = state === 'open' ? 'idle' : 'open';
    else if (b.dataset.act === 'close') state = 'idle';
    render();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state === 'open') { state = 'idle'; render(); } });
  render();
})();
</script>
</body>
</html>
