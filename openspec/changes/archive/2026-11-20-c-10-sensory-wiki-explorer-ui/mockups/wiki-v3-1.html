<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>C-10 Wiki v3.1 — Mockup Editorial</title>
  <!-- Approved design system (Rev 4) + compiled CSS of the real app (shell, tokens, utilities) -->
  <link rel="stylesheet" href="../../../../design-system/tokens.css" />
  <link rel="stylesheet" href="assets/c10-v2-snapshot.css" />
  <style>
    /* ---------- C-10 v3 mockup layer: tokens only, zero loose hex ---------- */
    .w { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 20px; }
    .w :focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
    .w-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-secondary); }
    .w-crumbs a { color: var(--text-secondary); text-decoration: none; min-height: 32px; display: inline-flex; align-items: center; }
    .w-crumbs a:hover { color: var(--accent-gold); }
    .w-crumbs b { color: var(--accent-gold); font-weight: 600; }
    .w-eyebrow { font: 600 10.5px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }

    /* Hub */
    .w-hero { position: relative; display: grid; grid-template-columns: 1.1fr 1fr; overflow: hidden; border-radius: 20px; border: 1px solid var(--border-subtle); background: var(--bg-dark-card); box-shadow: var(--shadow-card); }
    .w-hero-copy { padding: 28px 32px; display: grid; gap: 10px; align-content: center; z-index: 1; background: linear-gradient(120deg, var(--bg-dark-card), var(--bg-surface)); }
    .w-hero h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; color: var(--text-primary); }
    .w-hero p { margin: 0; color: var(--text-secondary); font-size: 14.5px; line-height: 1.6; max-width: 48ch; }
    .w-hero-photo { position: relative; min-height: 170px; max-height: 210px; }
    .w-hero-photo img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.1) saturate(1.15) brightness(.68); }
    .w-hero-photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg-dark-card), transparent 55%); }
    .w-hub { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
    .w-hub > :nth-child(-n+3) { grid-column: span 2; }
    .w-hub > :nth-child(n+4) { grid-column: span 3; }
    .w-sec {
      display: grid; grid-template-columns: auto 1fr; gap: 14px 16px; align-content: start; padding: 20px; border-radius: 18px; text-decoration: none; color: inherit;
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      transition: border-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);
    }
    .w-sec:hover { border-color: color-mix(in srgb, var(--accent-gold) 45%, transparent); transform: translateY(-2px); }
    .w-sec:active { transform: scale(var(--scale-press)); }
    .w-sec-icon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: var(--accent-gold); background: var(--accent-gold-soft); border: 1px solid color-mix(in srgb, var(--accent-gold) 28%, transparent); flex-shrink: 0; }
    .w-sec h2 { margin: 0; font-size: 19px; color: var(--text-primary); letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 10px; }
    .w-sec h2 small { font: 600 11px var(--font-mono); color: var(--text-muted); }
    .w-sec p { margin: 4px 0 0; font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; }
    .w-sec-samples { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
    .w-sec-samples span { font-size: 12px; color: var(--text-secondary); padding: 4px 9px; border-radius: var(--radius-pill); background: var(--bg-elevated); border: 1px solid var(--border-subtle); }
    .w-sec-go { grid-column: 1 / -1; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent-gold); }

    /* Section page */
    .w-sechead { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
    .w-sechead h1 { margin: 0; font-size: 1.9rem; letter-spacing: -0.02em; color: var(--text-primary); }
    .w-sechead p { margin: 4px 0 0; color: var(--text-secondary); font-size: 14px; }
    .w-search { position: relative; }
    .w-search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .w-search input { width: 100%; min-height: 50px; padding: 0 44px 0 42px; border-radius: 14px; border: 1px solid var(--border-recessed); background: var(--bg-elevated); color: var(--text-primary); font: 500 15px var(--font-sans); }
    .w-search input::placeholder { color: var(--text-muted); }
    .w-search input:focus { outline: none; border-color: var(--accent-gold); box-shadow: var(--shadow-focus); }
    .w-search .w-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--text-secondary); cursor: pointer; display: none; place-items: center; }
    .w-search.has-value .w-clear { display: grid; }
    .w-toolbar { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    .w-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .w-chip {
      min-height: 44px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--border-recessed); background: var(--bg-surface);
      color: var(--text-secondary); font: 600 13px var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none;
      transition: border-color var(--duration-fast) var(--ease-out), background-color var(--duration-fast) var(--ease-out);
    }
    .w-chip:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .w-chip[aria-pressed='true'], .w-chip[aria-checked='true'] { background: var(--accent-gold-soft); border-color: var(--accent-gold); color: var(--accent-gold); }
    .w-chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--fam); flex-shrink: 0; }
    .w-chip b { font: 600 11px var(--font-mono); color: var(--text-muted); }
    .w-chip[aria-checked='true'] b { color: var(--accent-gold); }
    .w-more { min-height: 50px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--border-recessed); background: var(--bg-elevated); color: var(--text-primary); font: 600 13.5px var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .w-more b { min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent-primary); color: var(--text-on-accent); font: 600 11px var(--font-mono); display: grid; place-items: center; padding: 0 5px; }
    .w-panel-filters { display: grid; gap: 14px; padding: 16px; border-radius: 16px; background: var(--bg-surface); border: 1px solid var(--border-subtle); }
    .w-panel-filters[hidden] { display: none; }
    .w-filter-row { display: grid; gap: 8px; }
    .w-resultbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--text-secondary); min-height: 40px; }
    .w-resultbar b { color: var(--text-primary); }
    .w-link-btn { min-height: 44px; border: 0; background: none; color: var(--accent-gold); font: 600 13px var(--font-sans); cursor: pointer; padding: 0 4px; }
    .w-group { display: grid; gap: 12px; }
    .w-group h2 { margin: 6px 0 0; display: flex; align-items: baseline; gap: 10px; font-size: 16px; color: var(--text-primary); letter-spacing: -0.01em; }
    .w-group h2 small { font: 600 11px var(--font-mono); color: var(--text-muted); }
    .w-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

    /* Cards with labeled mini sensory wheel & brewer icon */
    .w-card {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 10px; align-items: start; padding: 16px; border-radius: 16px; text-decoration: none; color: inherit;
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      transition: border-color var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);
    }
    .w-card:hover { border-color: color-mix(in srgb, var(--accent-gold) 45%, transparent); transform: translateY(-2px); }
    .w-card:active { transform: scale(var(--scale-press)); }
    .w-card-title-row { display: flex; align-items: flex-start; gap: 10px; }
    .w-brewer-badge {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0;
      background: var(--bg-elevated); border: 1px solid var(--border-subtle); color: var(--svg-vessel-stroke);
    }
    .w-brewer-badge--lg { width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, var(--bg-dark-card) 86%, var(--bg-elevated)); border-color: color-mix(in srgb, var(--accent-gold) 32%, transparent); }
    .w-card h3 { margin: 0; font-size: 16px; color: var(--text-primary); letter-spacing: -0.01em; line-height: 1.25; }
    .w-card-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
    .w-card .w-badges { margin-top: 8px; }
    .w-card-foot { grid-column: 1 / -1; }
    .w-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .w-badge { font: 600 9.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; color: var(--accent-gold); background: var(--accent-gold-soft); border: 1px solid color-mix(in srgb, var(--accent-gold) 30%, transparent); }
    .w-badge--ok { color: var(--status-optimal); background: var(--status-optimal-bg); border-color: color-mix(in srgb, var(--status-optimal) 35%, transparent); }
    .w-badge--muted { color: var(--text-secondary); background: var(--bg-elevated); border-color: var(--border-subtle); }
    .w-notes { display: flex; flex-wrap: wrap; gap: 6px; }
    .w-note { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: var(--radius-pill); font-size: 12px; color: var(--text-secondary); background: var(--bg-elevated); border: 1px solid var(--border-subtle); }
    .w-note i { width: 7px; height: 7px; border-radius: 50%; background: var(--fam); }
    .w-empty { padding: 34px 20px; text-align: center; border-radius: 16px; border: 1px dashed var(--border-strong); color: var(--text-secondary); display: grid; gap: 10px; justify-items: center; }
    .w-empty h2 { margin: 0; font-size: 16px; color: var(--text-primary); }

    /* Sensory wheel (full & labeled compact) */
    .w-wheel { display: block; width: 100%; height: auto; overflow: visible; }
    .w-wheel--full { max-width: 340px; margin: 0 auto; }
    .w-wheel .ring { fill: none; stroke: var(--border-recessed); stroke-width: 1; }
    .w-wheel .ring--outer { stroke: var(--border-strong); stroke-width: 1.4; }
    .w-wheel .spoke { stroke: var(--border-strong); stroke-width: 1.1; }
    .w-wheel .fill { fill: url(#wheelFill); }
    .w-wheel .fill-edge { fill: none; stroke: var(--accent-gold); stroke-width: 1.3; opacity: .88; }
    .w-wheel text { font: 600 11px var(--font-mono); letter-spacing: .07em; text-transform: uppercase; fill: var(--text-primary); }
    .w-wheel text.val { font: 600 12px var(--font-mono); fill: var(--accent-gold); letter-spacing: 0; text-transform: none; }
    .w-wheel text.tick { font: 500 8.5px var(--font-mono); fill: var(--text-muted); letter-spacing: 0; }
    .w-wheel--mini { width: 76px; flex-shrink: 0; }
    .w-card-profile { grid-column: 1 / -1; margin: 0; font-size: 12.5px; color: var(--text-secondary); line-height: 1.4; }
    .w-card-profile b { color: var(--accent-gold); font-weight: 600; }
    .w-wheel--mini .ring { stroke-width: 0.9; }
    .w-wheel--mini .spoke { stroke-width: 1; }
    .w-wheel-caption { margin: 0; font-size: 13px; color: var(--text-secondary); text-align: center; line-height: 1.45; }
    .w-wheel-caption b { color: var(--accent-gold); font-weight: 600; }

    /* ---------- Detail: Editorial Hierarchy ---------- */
    .w-detail { display: grid; grid-template-columns: minmax(0, 1.38fr) minmax(0, 0.92fr); gap: 22px; align-items: start; }
    .w-col { display: grid; gap: 20px; }
    .w-col--side { align-self: stretch; align-content: start; gap: 16px; }
    .w-toc { position: sticky; top: 96px; padding: 18px; border-radius: 18px; background: var(--bg-surface); border: 1px solid var(--border-subtle); display: grid; gap: 6px; }
    .w-toc h2 { margin: 0 0 4px; font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
    .w-toc button { min-height: 44px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: var(--text-secondary); font: 600 13.5px var(--font-sans); text-align: left; cursor: pointer; }
    .w-toc button:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .w-toc button span { font: 600 11px var(--font-mono); color: var(--accent-gold); }
    .w-chapter { scroll-margin-top: 96px; }

    /* Level 1: Editorial Hero (text-only & photographic brewer hero) */
    .w-head {
      position: relative; overflow: hidden; border-radius: 22px;
      background: linear-gradient(145deg, var(--bg-dark-card), var(--bg-surface));
      border: 1px solid var(--border-subtle); box-shadow: var(--shadow-card);
    }
    .w-head::before {
      content: ''; position: absolute; inset: 0 0 auto 0; height: 3px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-gold), transparent);
      z-index: 2;
    }
    .w-head-media { position: relative; height: 248px; overflow: hidden; background: var(--bg-canvas); }
    .w-head-media img { width: 100%; height: 100%; object-fit: cover; object-position: center; filter: contrast(1.06) saturate(1.1) brightness(.84); display: block; }
    .w-head-media::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg-canvas) 12%, transparent) 0%, color-mix(in srgb, var(--bg-dark-card) 35%, transparent) 55%, var(--bg-dark-card) 100%);
    }
    .w-head-media-cap {
      position: absolute; left: 16px; bottom: 30px; z-index: 2; max-width: calc(100% - 32px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font: 500 10px var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-on-photo); padding: 4px 10px; border-radius: var(--radius-pill);
      background: color-mix(in srgb, var(--bg-canvas) 76%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent-gold) 28%, transparent);
      backdrop-filter: blur(6px);
    }
    .w-head-body { padding: 26px 28px; display: grid; gap: 12px; position: relative; z-index: 1; }
    .w-head--photo .w-head-body { padding-top: 16px; margin-top: -18px; }
    .w-head-title-wrap { display: flex; align-items: center; gap: 14px; }
    .w-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .w-pill { font: 600 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 9px; border-radius: 7px; color: var(--text-secondary); background: var(--bg-elevated); border: 1px solid var(--border-subtle); }
    .w-pill--sec { color: var(--text-on-accent); background: var(--accent-primary); border-color: transparent; }
    .w-head h1 { margin: 0; font-size: 2.35rem; letter-spacing: -0.025em; color: var(--text-primary); line-height: 1.06; }
    .w-aliases { margin-top: 8px; font: 500 12.5px var(--font-mono); color: var(--accent-gold); line-height: 1.5; }
    .w-aliases small { font: inherit; color: var(--text-muted); }
    .w-summary { margin: 0; font-size: 15.5px; line-height: 1.65; color: var(--text-primary); opacity: .9; max-width: 64ch; }
    .w-quickfacts {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 6px 0 0; padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }
    .w-quickfacts--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .w-quickfacts div { display: grid; gap: 3px; align-content: start; }
    .w-quickfacts dt { font: 600 10px var(--font-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--text-muted); }
    .w-quickfacts dd { margin: 0; font-size: 13.5px; font-weight: 500; color: var(--text-primary); line-height: 1.35; }

    /* Level 2: Numbered Editorial Chapters (distinct from technical/utility panels) */
    .w-chapter {
      padding: 24px 26px; border-radius: 20px; background: var(--bg-surface);
      border: 1px solid var(--border-subtle); display: grid; gap: 16px;
    }
    .w-chapter--story {
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg-surface) 92%, var(--accent-primary-soft)), var(--bg-surface));
      border-color: color-mix(in srgb, var(--accent-gold) 22%, var(--border-subtle));
    }
    .w-chapter-head { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle); }
    .w-chapter-num { font: 600 12px var(--font-mono); color: var(--accent-gold); letter-spacing: .08em; padding: 3px 7px; border-radius: 6px; background: var(--accent-gold-soft); border: 1px solid color-mix(in srgb, var(--accent-gold) 28%, transparent); }
    .w-chapter-head h2 { margin: 0; font-size: 1.2rem; letter-spacing: -0.015em; color: var(--text-primary); }
    .w-chapter-sub { grid-column: 2; margin: 0; font-size: 13px; color: var(--text-muted); }

    .w-prose-stack { display: grid; gap: 12px; }
    .w-prose { margin: 0; font-size: 14.5px; line-height: 1.7; color: var(--text-secondary); }
    .w-prose b { color: var(--text-primary); font-weight: 600; }

    /* Cultural Symbolism & Historical Callout */
    .w-callout {
      padding: 15px 18px; border-radius: 12px;
      background: color-mix(in srgb, var(--accent-gold-soft) 72%, var(--bg-elevated));
      border: 1px solid color-mix(in srgb, var(--accent-gold) 28%, transparent);
      border-left: 3px solid var(--accent-gold);
      display: grid; gap: 6px;
    }
    .w-callout-label { font: 600 10.5px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-gold); display: inline-flex; align-items: center; gap: 6px; }
    .w-callout p { margin: 0; font-size: 13.5px; line-height: 1.62; color: var(--text-primary); opacity: .92; }

    /* Historical Milestones Timeline */
    .w-timeline { list-style: none; margin: 4px 0 0; padding: 0 0 0 18px; display: grid; gap: 12px; position: relative; }
    .w-timeline::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 1.5px; background: color-mix(in srgb, var(--accent-gold) 32%, var(--border-subtle)); }
    .w-timeline li { position: relative; display: grid; gap: 2px; }
    .w-timeline li::before { content: ''; position: absolute; left: -17px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-gold); border: 2px solid var(--bg-surface); }
    .w-timeline time { font: 600 11.5px var(--font-mono); color: var(--accent-gold); letter-spacing: .04em; }
    .w-timeline span { font-size: 13.5px; line-height: 1.5; color: var(--text-secondary); }

    /* Technical specs grid & side panels */
    .w-panel { padding: 20px; border-radius: 18px; background: var(--bg-surface); border: 1px solid var(--border-subtle); display: grid; gap: 14px; }
    .w-panel > h2 { margin: 0; font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
    .w-panel--accent { background: linear-gradient(180deg, var(--bg-dark-card), var(--bg-surface)); border-color: color-mix(in srgb, var(--accent-primary) 42%, var(--border-subtle)); }
    .w-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; }
    .w-meta--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .w-meta div { padding: 12px; border-radius: 12px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); display: grid; gap: 4px; align-content: start; }
    .w-meta dt { font: 600 10px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
    .w-meta dd { margin: 0; font-size: 14px; color: var(--text-primary); line-height: 1.4; }
    .w-note-link { min-height: 44px; padding: 0 14px; font-size: 13.5px; color: var(--text-primary); }
    .w-note-link svg { color: var(--text-muted); }

    .w-cta {
      min-height: 50px; border-radius: 12px; border: 0; background: var(--accent-primary); color: var(--text-on-accent); cursor: pointer; text-decoration: none;
      font: 600 14.5px var(--font-sans); display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-sm); padding: 0 16px; text-align: center;
      transition: background-color var(--duration-fast) var(--ease-out), transform var(--duration-press) var(--ease-out);
    }
    .w-cta:hover { background: var(--accent-primary-hover); }
    .w-cta:active { transform: scale(var(--scale-press)); }
    .w-cta--secondary { background: var(--accent-primary-soft); color: var(--accent-gold); box-shadow: none; border: 1px solid color-mix(in srgb, var(--accent-primary) 45%, transparent); }
    .w-cta--secondary:hover { background: color-mix(in srgb, var(--accent-primary) 34%, transparent); }
    .w-method { padding: 14px; border-radius: 14px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); display: grid; gap: 10px; }
    .w-method-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .w-method-head b { font-size: 15px; color: var(--text-primary); }
    .w-method-head span { font: 600 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-gold); }
    .w-method p { margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

    .w-tabs { display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 4px; border-radius: 12px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); justify-self: start; }

    .w-toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); opacity: 0; padding: 10px 16px; border-radius: 12px; background: var(--bg-tooltip); border: 1px solid var(--border-strong); color: var(--text-primary); font: 500 13px var(--font-mono); z-index: 80; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); pointer-events: none; }

    function toast(text) {
      const el = document.getElementById('toast');
      el.textContent = 'Navega a ' + text;
      el.classList.add('show');
      clearTimeout(toast.id);
      toast.id = setTimeout(() => el.classList.remove('show'), 1900);
    }

    // ---------- Sensory wheel (full + labeled compact for cards) ----------
    function sector(cx, cy, r, a0, a1) {
      const p = (a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      const [x0, y0] = p(a0); const [x1, y1] = p(a1);
      return `M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`;
    }
    function wheel(s, mini) {
      const label = SENSORY.map(([k, l]) => `${l} ${s[k]} de 5`).join(', ');
      if (mini) {
        const c = 32, R = 29, gap = 0.05, start = -Math.PI / 2;
        const gradId = `wf-${s.acidity}${s.sweetness}${s.body}${s.bitterness}`;
        let out = `<svg class="w-wheel w-wheel--mini" viewBox="0 0 64 64" aria-hidden="true">
          <defs><radialGradient id="${gradId}" cx="${c}" cy="${c}" r="${R}" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="var(--accent-primary)" stop-opacity=".95"/><stop offset="100%" stop-color="var(--accent-gold)" stop-opacity=".9"/></radialGradient></defs>`;
        SENSORY.forEach(([k], i) => {
          const a0 = start + i * Math.PI / 2 + gap, a1 = start + (i + 1) * Math.PI / 2 - gap;
          out += `<path d="${sector(c, c, (s[k] / 5) * R, a0, a1)}" fill="url(#${gradId})"/>`;
        });
        for (let i = 1; i <= 5; i++) out += `<circle class="ring ${i === 5 ? 'ring--outer' : ''}" cx="${c}" cy="${c}" r="${(i / 5) * R}"/>`;
        for (let i = 0; i < 4; i++) { const a = start + i * Math.PI / 2; out += `<line class="spoke" x1="${c}" y1="${c}" x2="${(c + R * Math.cos(a)).toFixed(2)}" y2="${(c + R * Math.sin(a)).toFixed(2)}"/>`; }
        return out + '</svg>';
      }

      const size = 300, c = size / 2, R = 104, gap = 0.03, start = -Math.PI / 2;
      let out = `<svg class="w-wheel w-wheel--full" viewBox="-40 -10 ${size + 80} ${size + 20}" role="img" aria-label="Perfil sensorial: ${label}">
        <defs><radialGradient id="wheelFill" cx="${c}" cy="${c}" r="${R}" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--accent-primary)" stop-opacity=".95"/><stop offset="100%" stop-color="var(--accent-gold)" stop-opacity=".9"/></radialGradient></defs>`;
      SENSORY.forEach(([k], i) => {
        const a0 = start + i * Math.PI / 2 + gap, a1 = start + (i + 1) * Math.PI / 2 - gap;
        const r = (s[k] / 5) * R;
        out += `<path class="fill" d="${sector(c, c, r, a0, a1)}"/><path class="fill-edge" d="${sector(c, c, r, a0, a1)}"/>`;
      });
      for (let i = 1; i <= 5; i++) out += `<circle class="ring ${i === 5 ? 'ring--outer' : ''}" cx="${c}" cy="${c}" r="${(i / 5) * R}"/>`;
      for (let i = 0; i < 4; i++) { const a = start + i * Math.PI / 2; out += `<line class="spoke" x1="${c}" y1="${c}" x2="${(c + R * Math.cos(a)).toFixed(2)}" y2="${(c + R * Math.sin(a)).toFixed(2)}"/>`; }
      for (let i = 1; i <= 5; i++) out += `<text class="tick" x="${c + 3}" y="${(c - (i / 5) * R + 9).toFixed(1)}">${i}</text>`;
      SENSORY.forEach(([k, l], i) => {
        const a = start + (i + 0.5) * Math.PI / 2, lr = R + 30;
        const x = c + lr * Math.cos(a), y = c + lr * Math.sin(a);
        const anchor = Math.cos(a) > 0.2 ? 'start' : Math.cos(a) < -0.2 ? 'end' : 'middle';
        out += `<text x="${x.toFixed(1)}" y="${(y - 2).toFixed(1)}" text-anchor="${anchor}">${l}</text><text class="val" x="${x.toFixed(1)}" y="${(y + 14).toFixed(1)}" text-anchor="${anchor}">${s[k]}/5</text>`;
      });
      return out + '</svg>';
    }

    // Readable one-line profile for cards: dominant attributes (>= 4), else the highest one.
    function cardProfile(s) {
      const sorted = SENSORY.map(([k, l]) => ({ l, v: s[k] })).sort((a, b) => b.v - a.v);
      const strong = sorted.filter((x) => x.v >= 4);
      const shown = (strong.length ? strong : sorted.filter((x) => x.v === sorted[0].v)).slice(0, 3);
      return `<p class="w-card-profile">Predomina: ${shown.map((x) => `${x.l} <b>${x.v}</b>`).join(' · ')}</p>`;
    }

    function sensorySummary(s) {
      const sorted = SENSORY.map(([k, l]) => ({ k, l, v: s[k] })).sort((a, b) => b.v - a.v);
      const top = sorted.filter((x) => x.v === sorted[0].v).map((x) => x.l.toLowerCase());
      return `Predomina <b>${top.join(' y ')}</b> (${sorted[0].v}/5).`;
    }

    // ---------- Drink Composition: Proportional Fill by ml + Distinct Vessel + High-Contrast Wall ----------
    // Colors tuned exclusively via Design System tokens so Milk vs Foam vs Glass Wall are unmistakably distinct
    const LAYERS = [
      ['water', 'Agua', 'var(--svg-water-stream)'],
      ['coffee', 'Café', 'var(--svg-coffee-liquid)'],
      ['milk', 'Leche', 'color-mix(in srgb, var(--accent-gold) 58%, var(--text-secondary))'],
      ['foam', 'Espuma', 'var(--text-primary)'],
    ];

    function vesselSpec(e) {
      const avg = (e.volume.min + e.volume.max) / 2;
      if (e.slug === 'cold-brew') {
        return { kind: 'tall-cold', label: 'Vaso alto con hielo', cap: 320, ticks: [100, 200, 300], avg, hasHandle: false, ice: true };
      }
      if (e.volume.max <= 115 && (e.slug === 'ristretto' || e.slug === 'espresso' || e.slug === 'lungo' || e.slug === 'macchiato')) {
        return { kind: 'demitasse', label: 'Pocillo', cap: 110, ticks: [30, 60, 90], avg, hasHandle: true, ice: false };
      }
      if (e.volume.max <= 205) {
        return { kind: 'medium-cup', label: e.slug === 'cortado' ? 'Vaso corto' : 'Taza mediana', cap: 200, ticks: [50, 100, 150], avg, hasHandle: e.slug !== 'cortado', ice: false };
      }
      return { kind: 'tall-cup', label: 'Taza grande', cap: 320, ticks: [100, 200, 300], avg, hasHandle: true, ice: false };
    }

    function cup(e) {
      const comp = e.composition;
      const spec = vesselSpec(e);
      const fillRatio = Math.max(0.16, Math.min(0.92, spec.avg / spec.cap));
      const clipId = `cupClip-${e.slug}`;

      // Outer vessel vs inner cavity (4px dark glass wall gap so white foam/milk NEVER bleeds into the vessel rim!)
      let outerPath, innerPath, handlePath, topY, botY, liqLeft, liqW, scaleX;
      if (spec.kind === 'demitasse') {
        topY = 44; botY = 128; liqLeft = 24; liqW = 84; scaleX = 148;
        outerPath = 'M20 44 H112 L106 116 Q104 132 90 132 H42 Q28 132 26 116 Z';
        innerPath = 'M25 48 H107 L102 115 Q100 128 89 128 H43 Q32 128 30 115 Z';
        handlePath = 'M110 58 h8 a13 13 0 0 1 0 28 h-10';
      } else if (spec.kind === 'medium-cup') {
        topY = 26; botY = 128; liqLeft = 22; liqW = 88; scaleX = 148;
        outerPath = 'M18 26 H114 L107 116 Q105 132 91 132 H41 Q27 132 25 116 Z';
        innerPath = 'M23 30 H109 L103 115 Q101 128 90 128 H42 Q31 128 29 115 Z';
        handlePath = 'M112 46 h8 a14 14 0 0 1 0 30 h-11';
      } else {
        // tall-cup or tall-cold
        topY = 14; botY = 130; liqLeft = 26; liqW = 80; scaleX = 148;
        outerPath = 'M22 14 H110 L103 120 Q101 134 89 134 H43 Q31 134 29 120 Z';
        innerPath = 'M27 18 H105 L99 119 Q97 130 88 130 H44 Q35 130 33 119 Z';
        handlePath = 'M108 38 h8 a15 15 0 0 1 0 34 h-11';
      }

      const innerH = botY - (topY + 4);
      const totalLiqH = innerH * fillRatio;
      const surfaceY = botY - totalLiqH;

      let y = botY, rects = '', dividers = '';
      const activeLayers = LAYERS.filter(([k]) => comp[k] > 0);
      activeLayers.forEach(([k, , color], idx) => {
        const lh = (comp[k] / 100) * totalLiqH;
        y -= lh;
        rects += `<rect x="${liqLeft}" y="${y.toFixed(1)}" width="${liqW}" height="${(lh + 0.6).toFixed(1)}" fill="${color}"/>`;
        // Subtle separator line between layers (especially milk vs foam)
        if (idx > 0) {
          dividers += `<line x1="${liqLeft}" y1="${(y + lh).toFixed(1)}" x2="${liqLeft + liqW}" y2="${(y + lh).toFixed(1)}" stroke="color-mix(in srgb, var(--bg-canvas) 38%, transparent)" stroke-width="1"/>`;
        }
      });

      // Golden crema cap on pure espresso/black coffee extractions (ristretto, espresso, lungo)
      let crema = '';
      if (!comp.milk && !comp.foam && !spec.ice && comp.coffee > 0) {
        const ch = Math.min(5, Math.max(3, totalLiqH * 0.14));
        crema = `<rect x="${liqLeft}" y="${surfaceY.toFixed(1)}" width="${liqW}" height="${ch.toFixed(1)}" fill="var(--svg-coffee-crema)" opacity=".88"/>`;
      }

      // Subtle translucent ice cubes for Cold Brew
      let ice = '';
      if (spec.ice) {
        ice = `<g opacity=".45" fill="var(--svg-vessel-glass)" stroke="var(--text-primary)" stroke-width="1">
          <rect x="38" y="${(surfaceY + 8).toFixed(1)}" width="18" height="16" rx="3" transform="rotate(-10 47 ${(surfaceY + 16).toFixed(1)})"/>
          <rect x="64" y="${(surfaceY + 12).toFixed(1)}" width="19" height="17" rx="3" transform="rotate(12 73 ${(surfaceY + 20).toFixed(1)})"/>
          <rect x="49" y="${(surfaceY + 32).toFixed(1)}" width="17" height="15" rx="3" transform="rotate(6 57 ${(surfaceY + 39).toFixed(1)})"/>
        </g>`;
      }

      // Meniscus highlight at liquid surface
      const meniscus = `<line x1="${liqLeft}" y1="${surfaceY.toFixed(1)}" x2="${liqLeft + liqW}" y2="${surfaceY.toFixed(1)}" stroke="color-mix(in srgb, var(--accent-gold) 65%, transparent)" stroke-width="1.2"/>`;

      // Graduation ticks on right side showing real ml volume scale
      const ticksSvg = spec.ticks.map((ml) => {
        const ty = botY - (ml / spec.cap) * innerH;
        return `<line x1="${scaleX - 6}" y1="${ty.toFixed(1)}" x2="${scaleX}" y2="${ty.toFixed(1)}" stroke="var(--border-strong)" stroke-width="1.2"/>
          <text x="${scaleX + 4}" y="${(ty + 3).toFixed(1)}" fill="var(--text-muted)" font-family="var(--font-mono)" font-size="11">${ml}</text>`;
      }).join('');

      // Active level indicator pointer at exact liquid height
      const levelPtr = `<line x1="106" y1="${surfaceY.toFixed(1)}" x2="${scaleX - 8}" y2="${surfaceY.toFixed(1)}" stroke="var(--accent-gold)" stroke-width="1" stroke-dasharray="2.5 2.5" opacity=".75"/>
        <circle cx="${scaleX - 8}" cy="${surfaceY.toFixed(1)}" r="2.2" fill="var(--accent-gold)"/>`;

      const aria = `Composición en ${spec.label} (${e.volume.min} a ${e.volume.max} ml): ` + LAYERS.filter(([k]) => comp[k]).map(([k, l]) => `${l} ${comp[k]}%`).join(', ');

      return `<div class="w-vessel-box">
        <svg viewBox="0 0 198 148" width="100%" role="img" aria-label="${esc(aria)}">
          <defs><clipPath id="${clipId}"><path d="${innerPath}"/></clipPath></defs>
          <!-- Outer dark vessel body -->
          <path d="${outerPath}" fill="var(--bg-canvas)" stroke="color-mix(in srgb, var(--accent-gold) 78%, var(--border-strong))" stroke-width="2.2" stroke-linejoin="round"/>
          <!-- Inner recessed cavity backdrop -->
          <path d="${innerPath}" fill="var(--bg-elevated)"/>
          <!-- Liquid layers clipped strictly inside inner cavity (leaves visible dark rim around milk/foam) -->
          <g clip-path="url(#${clipId})">${rects}${crema}${ice}${dividers}${meniscus}</g>
          <!-- Subtle inner glass highlight & rim contrast -->
          <path d="${innerPath}" fill="none" stroke="color-mix(in srgb, var(--bg-canvas) 68%, transparent)" stroke-width="1.5"/>
          <path d="M${liqLeft + 5} ${topY + 10} L${liqLeft + 9} ${botY - 12}" stroke="var(--svg-vessel-glass)" stroke-width="3" stroke-linecap="round"/>
          ${spec.hasHandle ? `<path d="${handlePath}" fill="none" stroke="color-mix(in srgb, var(--accent-gold) 72%, var(--border-strong))" stroke-width="2.2" stroke-linecap="round"/>` : ''}
          <!-- Saucer / base line -->
          <line x1="12" y1="138" x2="122" y2="138" stroke="var(--border-strong)" stroke-width="2" stroke-linecap="round"/>
          <!-- Volume scale & live fill level marker -->
          <line x1="${scaleX}" y1="${topY + 4}" x2="${scaleX}" y2="${botY}" stroke="var(--border-recessed)" stroke-width="1"/>
          ${ticksSvg}
          ${levelPtr}
        </svg>
        <div class="w-vessel-meta">${esc(spec.label)} · escala en ml (máx. ${spec.cap})</div>
      </div>`;
    }

    // ---------- Routing ----------
    function parse() {
      const hash = location.hash.replace(/^#/, '') || '/wiki';
      const [path, query = ''] = hash.split('?');
      const parts = path.split('/').filter(Boolean);
      const q = new URLSearchParams(query);
      return { section: parts[1] || null, slug: parts[2] || null, q: q.get('q') || '', grupo: q.get('grupo') || '', perfil: (q.get('perfil') || '').split(',').filter(Boolean), familia: q.get('familia') || '', filtros: q.get('filtros') === '1' };
    }
    function sectionHash(sec, s) {
      const q = new URLSearchParams();
      if (s.q) q.set('q', s.q); if (s.grupo) q.set('grupo', s.grupo);
      if (s.perfil.length) q.set('perfil', s.perfil.join(',')); if (s.familia) q.set('familia', s.familia);
      if (s.filtros) q.set('filtros', '1');
      const qs = q.toString();
      return `#/wiki/${sec}` + (qs ? '?' + qs : '');
    }
    const items = (sec) => D.sections[sec];
    const groupOrder = (sec) => D.groupOrder[sec] || [...new Set(items(sec).map((e) => e.group))];

    // ---------- Hub ----------
    function renderHub() {
      const order = ['origenes', 'varietales', 'procesos', 'cafeteras', 'bebidas'];
      main.innerHTML = `
        <section class="w-hero">
          <div class="w-hero-copy"><span class="w-eyebrow">Wiki del Café</span>
            <h1>Todo sobre el café, por tema</h1>
            <p>Elegí qué querés conocer: de dónde viene el grano, qué planta es, cómo se procesó, con qué cafetera prepararlo o qué bebida pedir.</p></div>
          <div class="w-hero-photo"><img src="${PHOTO_BASE}beans-moody.jpg" alt="" /></div>
        </section>
        <nav class="w-hub" aria-label="Secciones de la Wiki">
          ${order.map((k) => {
            const S = SECTIONS[k], list = items(k);
            return `<a class="w-sec" href="#/wiki/${k}"><span class="w-sec-icon">${ICON[S.icon]}</span>
              <div><h2>${S.title} <small>${list.length} fichas</small></h2><p>${S.desc}</p></div>
              <div class="w-sec-samples" aria-hidden="true">${list.slice(0, 4).map((e) => `<span>${esc(e.title)}</span>`).join('')}</div>
              <span class="w-sec-go">Explorar ${S.title.toLowerCase()} ${ICON.arrow}</span></a>`;
          }).join('')}
        </nav>`;
    }

    // ---------- Section ----------
    function filtered(sec, s) {
      const nq = norm(s.q);
      return items(sec).filter((e) => {
        if (s.grupo && e.group !== s.grupo) return false;
        for (const id of s.perfil) { const f = PROFILE_FILTERS.find((x) => x.id === id); if (f && !f.test(e.sensory)) return false; }
        if (s.familia && !e.notes.some((n) => n.family === s.familia)) return false;
        if (nq && !norm([e.slug, e.title, e.aliases, e.summary, ...e.notes.map((n) => n.label)].join(' ')).includes(nq)) return false;
        return true;
      });
    }
    function cardExtras(sec, e) {
      if (sec === 'cafeteras') return `<div class="w-badges">${e.methodId ? '<span class="w-badge w-badge--ok">Con estación</span>' : '<span class="w-badge w-badge--muted">Enciclopédica</span>'}${e.recipes.length ? `<span class="w-badge">${e.recipes.length} recetas</span>` : ''}</div>`;
      if (sec === 'bebidas') return `<div class="w-badges">${e.composition.milk || e.composition.foam ? '<span class="w-badge">Con leche</span>' : '<span class="w-badge w-badge--muted">Sin leche</span>'}<span class="w-badge w-badge--muted">${e.volume.min}–${e.volume.max} ml</span></div>`;
      return e.relevance === 'southern_cone_staple' ? '<div class="w-badges"><span class="w-badge">Cono Sur</span></div>' : '';
    }
    function card(sec, e) {
      const aria = `${e.title}. ` + SENSORY.map(([k, l]) => `${l} ${e.sensory[k]} de 5`).join(', ');
      const titleBlock = sec === 'cafeteras'
        ? `<div class="w-card-title-row"><span class="w-brewer-badge">${brewerIcon(e.slug, 20)}</span><div><h3>${esc(e.title)}</h3><div class="w-card-sub">${esc(e.groupLabel)}</div></div></div>`
        : `<div><h3>${esc(e.title)}</h3><div class="w-card-sub">${esc(e.groupLabel)}</div></div>`;
      return `<a class="w-card" href="#/wiki/${sec}/${e.slug}" aria-label="${esc(aria)}">
        <div>${titleBlock}${cardExtras(sec, e)}</div>
        ${wheel(e.sensory, true)}
        ${cardProfile(e.sensory)}
        <div class="w-card-foot w-notes">${e.notes.slice(0, 3).map((n) => `<span class="w-note" style="${fam(n.family)}"><i></i>${esc(n.label)}</span>`).join('')}</div></a>`;
    }
    function renderSection(sec, s) {
      const S = SECTIONS[sec], all = items(sec), results = filtered(sec, s);
      const groups = groupOrder(sec).map((g) => ({ g, list: results.filter((e) => e.group === g) })).filter((x) => x.list.length);
      const groupCounts = Object.fromEntries(groupOrder(sec).map((g) => [g, filtered(sec, { ...s, grupo: g }).length]));
      const extraActive = s.perfil.length + (s.familia ? 1 : 0);
      const anyActive = extraActive + (s.q ? 1 : 0) + (s.grupo ? 1 : 0);
      const labelFor = (g) => all.find((e) => e.group === g).groupLabel;

      main.innerHTML = `
        <nav class="w-crumbs" aria-label="Miga de pan"><a href="#/wiki">Wiki</a><span aria-hidden="true">/</span><b aria-current="page">${S.title}</b></nav>
        <header class="w-sechead"><span class="w-sec-icon">${ICON[S.icon]}</span><div><h1>${S.title}</h1><p>${S.desc}</p></div></header>
        <div class="w-toolbar">
          <label class="w-search ${s.q ? 'has-value' : ''}">${ICON.search}<span class="sr-only">Buscar en ${S.title}</span>
            <input type="search" id="q" value="${esc(s.q)}" placeholder="Buscar en ${S.title.toLowerCase()}" autocomplete="off" />
            <button class="w-clear" type="button" aria-label="Borrar búsqueda" data-clear>${ICON.x}</button></label>
          <button class="w-more" type="button" aria-expanded="${s.filtros}" aria-controls="morefilters" data-more>${ICON.sliders}<span>Perfil y sabor</span>${extraActive ? `<b>${extraActive}</b>` : ''}</button>
        </div>
        <div class="w-chips w-chips--scroll" role="radiogroup" aria-label="${S.groupLabel}">
          <button class="w-chip" role="radio" aria-checked="${!s.grupo}" data-grupo="">${S.groupAll} <b>${filtered(sec, { ...s, grupo: '' }).length}</b></button>
          ${groupOrder(sec).map((g) => `<button class="w-chip" role="radio" aria-checked="${s.grupo === g}" data-grupo="${g}">${esc(labelFor(g))} <b>${groupCounts[g]}</b></button>`).join('')}
        </div>
        <div class="w-panel-filters" id="morefilters" ${s.filtros ? '' : 'hidden'}>
          <div class="w-filter-row"><span class="w-eyebrow">Perfil en taza</span><div class="w-chips">${PROFILE_FILTERS.map((f) => { const on = s.perfil.includes(f.id); return `<button class="w-chip" aria-pressed="${on}" data-perfil="${f.id}">${on ? ICON.check : ''}${f.label}</button>`; }).join('')}</div></div>
          <div class="w-filter-row"><span class="w-eyebrow">Familia de sabor (rueda SCA)</span><div class="w-chips">${D.families.map((f) => `<button class="w-chip" aria-pressed="${s.familia === f.id}" data-familia="${f.id}" style="${fam(f.id)}"><i></i>${esc(f.label)}</button>`).join('')}</div></div>
        </div>
        <div class="w-resultbar" aria-live="polite"><span><b>${results.length}</b> ${results.length === 1 ? 'ficha' : 'fichas'}</span>${anyActive ? '<button class="w-link-btn" data-reset>Limpiar filtros</button>' : ''}</div>
        ${groups.length ? groups.map(({ g, list }) => `<section class="w-group" aria-labelledby="g-${g}"><h2 id="g-${g}">${esc(labelFor(g))} <small>${list.length}</small></h2><div class="w-grid">${list.map((e) => card(sec, e)).join('')}</div></section>`).join('')
          : `<div class="w-empty"><h2>No hay ${S.title.toLowerCase()} con esos filtros</h2><p style="margin:0">Probá con otra palabra o quitá algún filtro.</p><button class="w-chip" data-reset>Limpiar búsqueda y filtros</button></div>`}`;

      const go = (next, replace) => { const h = sectionHash(sec, next); replace ? history.replaceState(null, '', h) : history.pushState(null, '', h); render(); };
      const input = main.querySelector('#q');
      input.addEventListener('input', () => { const pos = input.selectionStart; go({ ...s, q: input.value }, true); const again = main.querySelector('#q'); again.focus(); again.setSelectionRange(pos, pos); });
      main.querySelector('[data-clear]').addEventListener('click', () => go({ ...s, q: '' }));
      main.querySelector('[data-more]').addEventListener('click', () => go({ ...s, filtros: !s.filtros }, true));
      main.querySelectorAll('[data-grupo]').forEach((b) => b.addEventListener('click', () => go({ ...s, grupo: b.dataset.grupo })));
      main.querySelectorAll('[data-perfil]').forEach((b) => b.addEventListener('click', () => { const id = b.dataset.perfil; go({ ...s, perfil: s.perfil.includes(id) ? s.perfil.filter((x) => x !== id) : [...s.perfil, id] }); }));
      main.querySelectorAll('[data-familia]').forEach((b) => b.addEventListener('click', () => go({ ...s, familia: s.familia === b.dataset.familia ? '' : b.dataset.familia })));
      main.querySelectorAll('[data-reset]').forEach((b) => b.addEventListener('click', () => go({ q: '', grupo: '', perfil: [], familia: '', filtros: s.filtros })));
    }

    // ---------- Cross-section relations ----------
    // SAMPLE DATA: the catalog has no origin <-> varietal link yet. In the app this becomes a
    // curated, sourced field in the editorial catalog; the reverse direction is always derived.
    const ORIGIN_VARIETALS = {
      brazil: ['mundo-novo', 'catuai', 'bourbon', 'robusta-canephora'],
      colombia: ['castillo', 'caturra', 'typica'],
      peru: ['typica', 'caturra', 'bourbon'],
      bolivia: ['typica', 'caturra'],
      ecuador: ['typica', 'sidra'],
      guatemala: ['bourbon', 'caturra', 'catuai'],
      'costa-rica': ['villa-sarchi', 'caturra', 'catuai'],
      'el-salvador': ['pacas', 'pacamara', 'bourbon'],
      honduras: ['catuai', 'caturra', 'pacas'],
      nicaragua: ['caturra', 'maragogype', 'pacamara'],
      panama: ['geisha', 'caturra', 'catuai'],
      mexico: ['typica', 'bourbon'],
      ethiopia: ['geisha'],
      kenya: ['sl28-sl34'],
      rwanda: ['bourbon'],
      sumatra: ['catimor', 'typica'],
    };
    const entryBySlug = (sec, slug) => items(sec).find((x) => x.slug === slug);
    const relChip = (sec, e, extra) => `<a class="w-chip" href="#/wiki/${sec}/${e.slug}">${esc(e.title)}${extra ? ` <small>${extra}</small>` : ''}</a>`;
    const brewerForMethod = (methodId) => items('cafeteras').find((b) => b.methodId === methodId);

    function varietalRelationChapter(sec, e) {
      if (sec === 'origenes') {
        const list = (ORIGIN_VARIETALS[e.slug] || []).map((slug) => entryBySlug('varietales', slug)).filter(Boolean);
        if (!list.length) return null;
        return { id: 'varietales', title: 'Varietales que se cultivan', sub: `Las plantas más comunes en ${e.title}`, body: `<div class="w-chips">${list.map((v) => relChip('varietales', v, '')).join('')}</div>` };
      }
      if (sec === 'varietales') {
        const list = Object.entries(ORIGIN_VARIETALS).filter(([, vs]) => vs.includes(e.slug)).map(([slug]) => entryBySlug('origenes', slug)).filter(Boolean);
        if (!list.length) return null;
        return { id: 'origenes', title: 'Dónde se cultiva', sub: 'Orígenes de la Wiki donde es una variedad habitual', body: `<div class="w-chips">${list.map((o) => relChip('origenes', o, o.groupLabel)).join('')}</div>` };
      }
      return null;
    }

    // Reverse of "Cómo prepararlo": every origin, varietal and process that recommends this brewer.
    function brewerCoffeesChapter(e) {
      if (!e.methodId) return null;
      const groups = [['origenes', 'Orígenes'], ['varietales', 'Varietales'], ['procesos', 'Procesos']].map(([sec, label]) => ({
        sec, label,
        list: items(sec).map((x) => ({ x, m: x.methods.find((m) => m.methodId === e.methodId) })).filter((r) => r.m),
      })).filter((g) => g.list.length);
      if (!groups.length) return null;
      return { id: 'cafes', title: 'Cafés que lucen en esta cafetera', sub: 'Fichas de la Wiki que la recomiendan, con el perfil sugerido', body: `<div class="w-rel">${groups.map((g) => `<div class="w-rel-group"><span>${g.label} · ${g.list.length}</span><div class="w-chips">${g.list.map(({ x, m }) => relChip(g.sec, x, m.profile)).join('')}</div></div>`).join('')}</div>` };
    }

    // ---------- Detail Helpers (Editorial Chapters) ----------
    // A chapter is { id, title, sub, body, story }. Chapters without content are never built,
    // and numbers (01, 02...) are assigned when rendering, so they always stay consecutive.
    function chapterHtml(ch, n) {
      return `<section class="w-chapter o3 ${ch.story ? 'w-chapter--story' : ''}" id="ch-${ch.id}" aria-labelledby="h-${ch.id}">
        <div class="w-chapter-head"><span class="w-chapter-num" aria-hidden="true">${String(n).padStart(2, '0')}</span><h2 id="h-${ch.id}">${ch.title}</h2>${ch.sub ? `<p class="w-chapter-sub">${ch.sub}</p>` : ''}</div>
        ${ch.body}</section>`;
    }
    function tocHtml(chapters) {
      if (chapters.length < 2) return '';
      return `<nav class="w-toc" aria-label="En esta ficha"><h2>En esta ficha</h2>${chapters.map((ch, i) => `<button type="button" data-goto="ch-${ch.id}"><span>${String(i + 1).padStart(2, '0')}</span>${ch.title}</button>`).join('')}</nav>`;
    }

    // Editorial history only exists for prototyped entries (the catalog will add it later).
    // Without it the chapter is omitted: never repeat the summary, never show internal notes.
    function storyChapter(sec, e, fallbackStory) {
      const ed = EDITORIAL[`${sec}/${e.slug}`];
      if (ed) {
        return { id: 'historia', title: 'Historia y simbología cultural', sub: ed.storySubtitle, story: true, body: `
          <div class="w-prose-stack">${ed.paragraphs.map((p) => `<p class="w-prose">${p}</p>`).join('')}</div>
          <aside class="w-callout"><span class="w-callout-label">${ICON.spark} ${esc(ed.symbolismLabel)}</span><p>${ed.symbolism}</p></aside>
          ${ed.milestones ? `<ol class="w-timeline">${ed.milestones.map(([yr, txt]) => `<li><time>${esc(yr)}</time><span>${txt}</span></li>`).join('')}</ol>` : ''}` };
      }
      if (fallbackStory && fallbackStory !== e.summary) {
        return { id: 'historia', title: 'Origen e historia', sub: 'Cómo nació y cómo se popularizó', story: true, body: `<p class="w-prose">${esc(fallbackStory)}</p>` };
      }
      return null;
    }
    const notesChapter = (e) => e.notes.length ? { id: 'notas', title: 'Vocabulario en taza', sub: 'Tocá una nota para ubicarla en la Rueda de Sabores SCA',
      body: `<div class="w-chips">${e.notes.map((n) => `<a class="w-chip w-note-link" style="${fam(n.family)}" href="#nav" data-to="/flavor-wheel?node=${n.id}"><i></i>${esc(n.label)} ${ICON.wheel}</a>`).join('')}</div>` } : null;

    const wheelPanel = (e) => `<section class="w-panel o2" aria-labelledby="h-wheel"><h2 id="h-wheel">Perfil sensorial</h2>${wheel(e.sensory, false)}<p class="w-wheel-caption">${sensorySummary(e.sensory)}</p></section>`;

    function detailWiki(sec, e) {
      const rows = e.meta.map(([k, v]) => [k, k === 'Fermentación' ? (FERMENTATION[v] || v) : v]);
      const headFacts = `<dl class="w-quickfacts">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
      const methods = `<section class="w-panel w-panel--accent o2b" aria-labelledby="h-m"><h2 id="h-m">Cómo prepararlo</h2>${e.methods.map((m, i) => `<div class="w-method"><div class="w-method-head"><b>${esc(m.method)}</b><span>${esc(m.profile)}</span></div><p>${esc(m.reason)}</p>
        <a class="w-cta ${i ? 'w-cta--secondary' : ''}" href="#nav" data-to="/brew/${m.methodId}?profile=${m.profileId}">Preparar en ${esc(m.method)} (${esc(m.profile)}) ${ICON.arrow}</a>
        ${brewerForMethod(m.methodId) ? `<a class="w-method-more" href="#/wiki/cafeteras/${brewerForMethod(m.methodId).slug}">${brewerIcon(brewerForMethod(m.methodId).slug, 16)} Conocer la ${esc(brewerForMethod(m.methodId).title)}</a>` : ''}</div>`).join('')}</section>`;
      return { headFacts, media: null, titleIcon: null, chapters: [varietalRelationChapter(sec, e), storyChapter(sec, e, null), notesChapter(e)], side: wheelPanel(e) + methods };
    }

    function detailBrewer(e) {
      const photo = BREWER_PHOTO[e.slug];
      const headFacts = `<dl class="w-quickfacts"><div><dt>Creador / Diseño</dt><dd>${esc(e.history.inventor)}</dd></div><div><dt>Origen</dt><dd>${esc(e.history.country)}</dd></div><div><dt>Época</dt><dd>${esc(e.history.era)}</dd></div></dl>`;

      // Practical first: recipes (or the traditional preparation), then how it works, then history.
      const featured = e.recipes.filter((r) => r.kind === 'author'), traditional = e.recipes.filter((r) => r.kind !== 'author');
      const recipeCard = (r, primary) => `<article class="w-recipe"><h3>${esc(r.title)}</h3><span class="w-recipe-by">${esc(r.author)}</span>
        <div class="w-recipe-stats"><span>${DIFFICULTY[r.difficulty] || r.difficulty}</span>${r.temp ? `<span>${esc(r.temp)}</span>` : ''}<span>${mmss(r.duration)} min</span></div>
        <p>${esc(r.process)}</p><p><b>En taza:</b> ${esc(r.flavor)}</p>
        <a class="w-cta ${primary ? '' : 'w-cta--secondary'}" href="#nav" data-to="/brew/${e.methodId}?recipe=${r.id}">Preparar esta receta ${ICON.arrow}</a></article>`;
      const prepare = e.methodId
        ? { id: 'recetas', title: 'Recetas de autor y tradicionales', sub: 'Elegí una y se abre directo en la estación', body: `
            <div class="w-tabs" role="tablist" aria-label="Tipo de receta"><button class="w-tab" role="tab" aria-selected="true" data-rt="author">De autor <b>${featured.length}</b></button><button class="w-tab" role="tab" aria-selected="false" data-rt="trad">Tradicionales <b>${traditional.length}</b></button></div>
            <div class="w-recipes" data-rlist="author">${featured.map((r, i) => recipeCard(r, i === 0)).join('')}</div>
            <div class="w-recipes" data-rlist="trad" hidden>${traditional.map((r) => recipeCard(r, false)).join('')}</div>` }
        : { id: 'preparacion', title: 'Cómo se prepara', sub: 'Preparación tradicional paso a paso', body: `<p class="w-prose">${esc(e.traditional)}</p><div class="w-noted">${ICON.info}<span>Esta cafetera es de consulta: todavía no tiene estación con temporizador en la app.</span></div>` };
      const howItWorks = { id: 'funciona', title: 'Cómo funciona', sub: `Principio físico · ${e.groupLabel}`, body: `<p class="w-prose">${esc(e.history.howItWorks)}</p>` };
      const drinks = e.drinks.length ? { id: 'bebidas', title: 'Bebidas que nacen con esta cafetera', sub: 'Explorá sus proporciones y variantes', body: `<div class="w-chips">${e.drinks.map((d) => `<a class="w-chip" href="#/wiki/bebidas/${d.slug}">${esc(d.title)}</a>`).join('')}</div>` } : null;
      const station = e.methodId ? `<section class="w-panel w-panel--accent o2b"><h2>Estación de preparación</h2><p class="w-prose" style="font-size:13.5px">Calculadora de dosis y temporizador paso a paso con la receta estándar.</p>
        <a class="w-cta" href="#nav" data-to="/brew/${e.methodId}">Abrir estación ${esc(e.methodName)} ${ICON.arrow}</a></section>` : '';
      return {
        headFacts,
        media: photo ? `<div class="w-head-media"><img src="${photo.src}" alt="${esc(e.title)}" /><span class="w-head-media-cap">${esc(photo.caption)}</span></div>` : null,
        titleIcon: `<span class="w-brewer-badge w-brewer-badge--lg">${brewerIcon(e.slug, 28)}</span>`,
        chapters: [prepare, howItWorks, brewerCoffeesChapter(e), storyChapter('cafeteras', e, null), notesChapter(e), drinks],
        side: wheelPanel(e) + station,
      };
    }

    function detailDrink(e) {
      const headFacts = `<dl class="w-quickfacts"><div><dt>Origen</dt><dd>${esc(e.history.country)}</dd></div><div><dt>Época</dt><dd>${esc(e.history.era)}</dd></div><div><dt>Servicio típico</dt><dd>${e.volume.min}–${e.volume.max} ml</dd></div></dl>`;
      const compo = { id: 'composicion', title: 'Composición y proporciones', sub: 'Nivel de llenado a escala real según el recipiente', body: `<div class="w-compo">${cup(e)}
        <ul class="w-legend">${LAYERS.slice().reverse().map(([k, l, color]) => `<li class="${e.composition[k] ? '' : 'off'}" style="--layer:${color}"><i></i><span>${l}</span><b>${e.composition[k]}%</b></li>`).join('')}
        <li class="w-legend-vol" style="--layer:transparent"><i style="border-style:dashed"></i><span>Volumen servido</span><b>${e.volume.min}–${e.volume.max} ml</b></li></ul></div>
        <p class="w-prose"><b>Cómo se prepara.</b> ${esc(e.history.preparation)}</p>
        <div class="w-chips"><span class="w-eyebrow" style="align-self:center">Cafetera base</span>${e.baseBrewers.map((b) => `<a class="w-chip" href="#/wiki/cafeteras/${b.slug}">${brewerIcon(b.slug, 16)} ${esc(b.title)}</a>`).join('')}</div>` };
      const variants = e.variants.length ? { id: 'variantes', title: 'Variantes regionales y de barra', sub: 'Cómo se pide y adapta según la cultura cafetera', body: `<div class="w-variants">${e.variants.map((v) => `<div class="w-variant"><span>${esc(v.region)}</span><b>${esc(v.name)}</b><p>${esc(v.description)}</p></div>`).join('')}</div>` } : null;
      const brew = e.brewLink ? `<section class="w-panel w-panel--accent o2b"><h2>Prepararla</h2><p class="w-prose" style="font-size:13.5px">Empezá por la base: el ${esc(e.brewLink.method)} con perfil ${esc(e.brewLink.profile)}.</p>
        <a class="w-cta" href="#nav" data-to="/brew/${e.brewLink.methodId}?profile=${e.brewLink.profileId}">Preparar la base en ${esc(e.brewLink.method)} (${esc(e.brewLink.profile)}) ${ICON.arrow}</a></section>`
        : `<section class="w-panel o2b"><h2>Prepararla</h2><div class="w-noted">${ICON.info}<span>No usa una estación de la app: seguí la preparación de esta ficha.</span></div></section>`;
      return { headFacts, media: null, titleIcon: null, chapters: [compo, storyChapter('bebidas', e, e.history.story), variants, notesChapter(e)], side: wheelPanel(e) + brew };
    }

    // Long alias lists are capped; the rest stays available to screen readers and on hover.
    function aliasesHtml(text) {
      const list = text.split(/,\s*/).filter(Boolean);
      const MAX = 3;
      if (list.length <= MAX) return `<div class="w-aliases">${esc(list.join(', '))}</div>`;
      return `<div class="w-aliases" title="${esc(list.join(', '))}">${esc(list.slice(0, MAX).join(', '))} <small>y ${list.length - MAX} más</small><span class="sr-only">: ${esc(list.slice(MAX).join(', '))}</span></div>`;
    }

    function renderDetail(sec, slug) {
      const S = SECTIONS[sec], e = items(sec).find((x) => x.slug === slug);
      if (!e) { main.innerHTML = '<div class="w-empty"><h2>404 — Ruta no encontrada</h2><a class="w-back" href="#/wiki">Volver a la Wiki</a></div>'; return; }
      const parts = sec === 'cafeteras' ? detailBrewer(e) : sec === 'bebidas' ? detailDrink(e) : detailWiki(sec, e);
      const chapters = parts.chapters.filter(Boolean);
      const back = sessionStorage.getItem('w-last-' + sec) || `#/wiki/${sec}`;
      main.innerHTML = `
        <nav class="w-crumbs" aria-label="Miga de pan"><a href="#/wiki">Wiki</a><span aria-hidden="true">/</span><a href="${back}">${S.title}</a><span aria-hidden="true">/</span><b aria-current="page">${esc(e.title)}</b></nav>
        <div class="w-detail">
          <div class="w-col">
            <header class="w-head ${parts.media ? 'w-head--photo' : ''} o1">
              ${parts.media || ''}
              <div class="w-head-body">
                <div class="w-pills"><span class="w-pill w-pill--sec">${S.singular}</span><span class="w-pill">${esc(e.groupLabel)}</span><span class="w-pill">${esc(e.relevanceLabel)}</span></div>
                <div class="w-head-title-wrap">${parts.titleIcon || ''}<div><h1>${esc(e.title)}</h1>${aliasesHtml(e.aliases)}</div></div>
                <p class="w-summary">${esc(e.summary)}</p>
                ${parts.headFacts || ''}
              </div>
            </header>
            ${chapters.map((ch, i) => chapterHtml(ch, i + 1)).join('')}
            <a class="w-back o8" href="${back}">${ICON.back} Volver a ${S.title}</a>
          </div>
          <div class="w-col w-col--side">${parts.side}${tocHtml(chapters)}</div>
        </div>`;
      main.querySelectorAll('[data-to]').forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); toast(a.dataset.to); }));
      main.querySelectorAll('[data-goto]').forEach((b) => b.addEventListener('click', () => {
        const target = document.getElementById(b.dataset.goto);
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
        const heading = target.querySelector('h2');
        heading.setAttribute('tabindex', '-1');
        heading.focus({ preventScroll: true });
      }));
      main.querySelectorAll('[data-rt]').forEach((b) => b.addEventListener('click', () => {
        main.querySelectorAll('[data-rt]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
        main.querySelectorAll('[data-rlist]').forEach((l) => { l.hidden = l.dataset.rlist !== b.dataset.rt; });
      }));
    }

    function render() {
      const r = parse();
      if (!r.section) renderHub();
      else if (!SECTIONS[r.section]) main.innerHTML = '<div class="w-empty"><h2>404 — Ruta no encontrada</h2><a class="w-back" href="#/wiki">Volver a la Wiki</a></div>';
      else if (!r.slug) { sessionStorage.setItem('w-last-' + r.section, location.hash); renderSection(r.section, r); }
      else { renderDetail(r.section, r.slug); window.scrollTo(0, 0); }
    }
    window.addEventListener('popstate', render);
    window.addEventListener('hashchange', render);
    render();
  })();
  </script>
</body>
</html>
