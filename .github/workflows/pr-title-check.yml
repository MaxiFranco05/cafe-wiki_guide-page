name: Validar título de PR a main

# Requisito para pasar a producción: el título del PR hacia `main` define la versión.
# Formato exacto:  release: vMAJOR.MINOR.PATCH   (ej. "release: v1.2.0")
# Para bloquear el merge, marcar este check como "required" en la protección de la rama `main`.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar formato, orden de versión, package.json y tag libre
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          regex='^release: v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$PR_TITLE" =~ $regex ]]; then
            echo "::error title=Título de PR inválido::Debe ser exactamente 'release: vX.Y.Z' (ej. 'release: v1.2.0'). Recibido: '$PR_TITLE'"
            exit 1
          fi
          version="${PR_TITLE#release: v}"

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error title=Versión repetida::El tag v${version} ya existe."
            exit 1
          fi

          # La versión actual es la de la rama base (main), no la del PR.
          base_ref="origin/${BASE_REF}"
          git fetch -q origin "${BASE_REF}"
          current=$(git show "${base_ref}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          highest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)
          if [ "$version" = "$current" ] || [ "$highest" != "$version" ]; then
            echo "::error title=Versión no incrementada::v${version} debe ser mayor que la versión actual de ${BASE_REF} (${current})."
            exit 1
          fi

          # El PR debe llevar package.json con la misma versión que el título.
          pr_version=$(node -p "require('./package.json').version")
          if [ "$pr_version" != "$version" ]; then
            echo "::error title=package.json desalineado::package.json tiene ${pr_version} pero el título indica ${version}. Actualizá package.json y package-lock.json en el PR."
            exit 1
          fi
          echo "OK: ${current} -> ${version}"
