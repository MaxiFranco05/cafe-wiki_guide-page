  <desc id="logoDesc">Geometric V60 dripper mark with provisional badge</desc>
  <!-- Outer badge container -->
  <rect x="2" y="4" width="48" height="48" rx="12" fill="#181310" stroke="#C85A32" stroke-width="1.5"/>
